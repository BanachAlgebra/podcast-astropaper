
media:
  input: public/images
  output: /images

settings:
  content:
    merge: true

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: src/content/posts
    filename: "{primary}.md"
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: pubDatetime
        label: Publication Date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: draft
        type: boolean
      - name: tags
        type: string
        list: true
      - name: body
        label: Article
        type: rich-text
